<!doctype html><html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>출석 체크 | HONG EON JOO</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" /><link rel="stylesheet" href="attendance.css" /></head><body><main><p class="eyebrow">KTC ATTENDANCE</p><h1>출석 체크</h1><aside class="attendance-notice"><strong>출석 안내</strong><ul><li>출석은 지정된 <b>강의실 PC망</b>에서만 가능합니다.</li><li>관리자가 연 출석 코드와 QR은 <b>30초 동안만</b> 유효합니다.</li><li>학번 9자리·이름·휴대폰번호는 수강생 명단과 일치해야 합니다.</li></ul></aside><section id="start-view"><p>관리자가 안내한 현재 6자리 출석 코드를 입력하세요.</p><form id="code-form"><input id="access-code" inputmode="numeric" maxlength="6" placeholder="출석 코드 6자리" required /><button>출석 시작</button></form></section><section id="checkin-view" hidden><p id="session-info"></p><p class="timer">남은 시간 <strong id="timer">00</strong>초</p><div class="timer-bar" aria-label="출석 시간 진행"><span id="timer-progress"></span></div><p class="timer-guide">시간이 끝나면 출석할 수 없습니다. 정보를 빠르게 확인해 제출하세요.</p><form id="checkin-form"><label>학번<input id="student-id" inputmode="numeric" maxlength="9" placeholder="9자리 숫자" required /></label><label>이름<input id="student-name" required /></label><label>휴대폰번호<input id="student-phone" inputmode="tel" placeholder="010-1234-5678" required /></label><button>출석 확인</button></form></section><p id="message" role="status"></p></main><script src="attendance.js"></script></body></html>
