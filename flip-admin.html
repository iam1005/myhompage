<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>판뒤집기 관리</title><style>body{margin:0;background:#f7f7f4;font:15px Arial}main{max-width:1000px;margin:auto;padding:60px 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.card{background:#fff;border-top:2px solid #222;padding:25px}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;font:inherit}button{background:#171717;color:#fff;border:0}.code{font-size:48px;font-weight:800;letter-spacing:.1em}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><a href="admin.html">← 관리자</a><h1>한글 판뒤집기</h1><section id="login"><input id="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호"><button onclick="login()">로그인</button></section><section id="app" hidden class="grid"><form class="card" onsubmit="create(event)"><h2>게임 열기</h2><textarea id="words" rows="10" placeholder="단어를 한 줄에 하나씩 입력하세요&#10;가&#10;나&#10;다&#10;라&#10;마&#10;바" required></textarea><select id="seconds"><option value="120">2분</option><option value="180">3분</option><option value="300">5분</option></select><button>게임 시작</button><p id="msg"></p></form><section class="card" id="result"><h2>현재 게임</h2><p>왼쪽에서 단어판을 만들고 시작하세요.</p></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="supabase-config.js"></script><script src="flip-admin.js"></script>
