<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한글 판뒤집기</title><style>body{font:16px Arial;margin:0;background:#f7f7f4}main{max-width:900px;margin:auto;padding:40px}input,button{padding:12px;font:inherit}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.tile{padding:18px 6px;text-align:center;background:#ddd;font-weight:bold}.red{background:#d94b4b;color:#fff}.blue{background:#3775c9;color:#fff}</style><main><h1>한글 판뒤집기</h1><div id="join"><input id="name" placeholder="닉네임"><button onclick="join()">팀 자동 배정 후 입장</button></div><section id="play" hidden><h2 id="score"></h2><p id="team"></p><input id="word" placeholder="판의 단어를 정확히 입력"><button onclick="flip()">판 뒤집기</button><div class="board" id="board"></div></section></main><script src="flip-game.js"></script>
