<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>출석 체크 | HONG EON JOO</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"><link rel="stylesheet" href="attendance.css"><style>.result{margin-top:28px;padding:23px;border-top:2px solid #171717;background:#fff}.result h2{margin:0;font-size:22px}.result-score{margin:10px 0 0;font-size:16px}.result-score b{font-size:25px}.sheet{overflow:auto;margin-top:20px}.sheet table{border-collapse:collapse;width:100%}.sheet th,.sheet td{padding:9px;border:1px solid #d3d3ce;font-size:12px;text-align:center;white-space:nowrap}.sheet th{background:#ecece8}.present{color:#176234;font-weight:700}.absent{color:#a22;font-weight:700}.grading{margin-top:20px}.grading summary{cursor:pointer;font-weight:700}.grade-table{margin-top:12px;border-collapse:collapse}.grade-table th,.grade-table td{padding:7px 12px;border:1px solid #d3d3ce;font-size:12px;text-align:center}.grade-table th{background:#ecece8}.grade-table tr.current td{background:#171717;color:#fff;font-weight:700}</style></head><body><main><p class="eyebrow">KTC ATTENDANCE</p><h1>출석 체크</h1><aside class="attendance-notice"><strong>출석 안내</strong><ul><li>출석은 지정된 <b>강의실 PC망</b>에서만 가능합니다.</li><li>관리자가 연 출석 코드와 QR은 <b>30초 동안만</b> 유효합니다.</li><li>학번 9자리·이름·휴대폰번호는 수강생 명단과 일치해야 합니다.</li></ul></aside><section id="checkin-view"><p id="session-info">아래 네 가지 정보를 모두 입력해 출석을 확인하세요.</p><p class="timer" id="timer-wrap" hidden>남은 시간 <strong id="timer">00</strong>초</p><div class="timer-bar" id="timer-bar" aria-label="출석 시간 진행" hidden><span id="timer-progress"></span></div><p class="timer-guide" id="timer-guide">출석 코드를 입력하면 남은 시간이 표시됩니다.</p><form id="checkin-form"><label>학번<input id="student-id" inputmode="numeric" maxlength="9" placeholder="9자리 숫자" required></label><label>이름<input id="student-name" required></label><label>휴대폰번호<input id="student-phone" inputmode="tel" placeholder="010-1234-5678" required></label><label>출석 코드<input id="access-code" inputmode="numeric" maxlength="6" placeholder="6자리 숫자" required></label><button>출석 확인</button></form></section><p id="message" role="status"></p><section id="result" hidden></section></main><script src="attendance.js"></script></body></html>
