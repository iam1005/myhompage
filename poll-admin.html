<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실시간 설문 관리</title><style>body{margin:0;background:#f7f7f4;color:#171717;font:15px Pretendard,Arial,sans-serif}main{max-width:1100px;margin:auto;padding:70px 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}.card{background:#fff;border-top:2px solid #171717;padding:28px}input,textarea,select,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;font:inherit}button{background:#171717;color:#fff;border:0;cursor:pointer}.code{font-size:48px;font-weight:800;letter-spacing:.1em}.bar{height:28px;background:#222;color:white;margin:8px 0;padding:5px 9px}.word{display:inline-block;margin:6px;padding:9px 12px;background:#e7e7e2}.msg{color:#a22}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><a href="admin.html">← 관리자</a><h1>실시간 익명 설문</h1><section id="login"><input id="email" type="email" placeholder="관리자 이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login-btn">로그인</button><p id="login-msg" class="msg"></p></section><section id="app" hidden><div class="grid"><form class="card" id="create"><h2>새 설문 열기</h2><textarea id="question" placeholder="학생에게 물어볼 질문" required></textarea><select id="type"><option value="choice">객관식 · 막대그래프</option><option value="word">단답형 · 워드클라우드</option></select><textarea id="options" placeholder="선택지를 한 줄에 하나씩 입력하세요&#10;매우 그렇다&#10;그렇다&#10;보통이다" required></textarea><button>설문 열기</button><p id="create-msg" class="msg"></p></form><section class="card" id="result"><h2>현재 설문</h2><p>왼쪽에서 설문을 열어주세요.</p></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="supabase-config.js"></script><script src="poll-admin.js"></script>
