<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>출석 관리 | HONG EON JOO</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"><link rel="stylesheet" href="attendance-admin.css"></head><body><header><a href="admin.html">← 관리자</a><strong>출석 관리</strong></header><main><section id="login-view"><h1>출석 관리</h1><p>관리자 계정으로 로그인하세요.</p><form id="login-form"><input id="email" type="email" placeholder="이메일" required><input id="password" type="password" placeholder="비밀번호" required><button>로그인</button></form><p id="login-message"></p></section><section id="attendance-view" hidden><div class="top"><div><p>ATTENDANCE ADMINISTRATION</p><h1>출석 관리</h1></div><button id="logout" class="plain">로그아웃</button></div><nav class="tabs"><button class="active" data-panel="start">출석 시작</button><button data-panel="roster">수강생 명단</button><button data-panel="matrix">출석현황</button></nav><section class="panel active" id="start"><div class="grid"><form class="card" id="start-form"><h2>교시 출석 열기</h2><label>과목<select id="start-course"><option value="ai">AI수처리 · 월 2교시</option><option value="visualization">경영정보시각화 · 화 3교시</option><option value="excel">비즈니스엑셀 · 수 3교시</option><option value="accounting">스타트업세무전산회계 · 목 3교시</option></select></label><label>주차<select id="start-week"></select></label><label>교시<select id="start-period"></select></label><label>출석 방식<select id="start-mode"><option value="pc">PC 출석 (교내 PC망만)</option><option value="wireless">무선 출석 (설정 후 사용)</option></select></label><button>30초 출석 시작</button><p class="message" id="start-message"></p></form><section class="card" id="session-card"><h2>현재 출석 코드</h2><p class="empty">출석을 시작하면 QR 코드와 6자리 코드가 표시됩니다.</p></section></div></section><section class="panel" id="roster"><div class="grid"><form class="card" id="roster-form"><h2>수강생 명단 업로드</h2><label>과목<select id="roster-course"><option value="ai">AI수처리</option><option value="visualization">경영정보시각화</option><option value="excel">비즈니스엑셀</option><option value="accounting">스타트업세무전산회계</option></select></label><label>CSV 파일<input id="roster-file" type="file" accept=".csv,text/csv" required></label><p class="hint">열 순서: 학번, 이름, 휴대폰번호<br>학번은 숫자 9자리입니다.</p><button>명단 업로드</button><p class="message" id="roster-message"></p></form><section class="card"><h2>파일 예시</h2><pre>학번,이름,휴대폰번호
202601001,홍길동,010-1234-5678</pre></section></div></section><section class="panel" id="matrix"><div class="matrix-head"><div><h2>출석현황</h2><p>공란은 출석, <b>/</b>는 결석입니다.</p></div><div><select id="matrix-course"><option value="ai">AI수처리</option><option value="visualization">경영정보시각화</option><option value="excel">비즈니스엑셀</option><option value="accounting">스타트업세무전산회계</option></select><button id="download">Excel용 CSV 다운로드</button></div></div><div class="table-wrap"><table id="matrix-table"></table></div><p class="message" id="matrix-message"></p></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script src="supabase-config.js"></script><script src="attendance-admin.js"></script></body></html>
