<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>비밀번호 재설정 | HONG EON JOO</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"><style>body{margin:0;background:#f8f8f6;color:#171717;font-family:Pretendard,"Noto Sans KR",sans-serif}main{width:min(100% - 40px,430px);margin:0 auto;padding:15vh 0}h1{font-size:42px;letter-spacing:-.07em}p{line-height:1.7;color:#555}form{display:grid;gap:15px;margin-top:30px}input,button{padding:14px;border:1px solid #222;font:inherit}button{background:#222;color:white;font-weight:600}#message{min-height:25px;color:#a22}</style></head><body><main><h1>새 비밀번호 설정</h1><p>새 비밀번호를 입력해 관리자 계정 비밀번호를 변경하세요.</p><form id="form"><input id="password" type="password" minlength="8" placeholder="새 비밀번호 (8자 이상)" required><input id="confirm" type="password" minlength="8" placeholder="새 비밀번호 다시 입력" required><button>비밀번호 변경</button></form><p id="message"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const form=document.querySelector('#form'),message=document.querySelector('#message');form.addEventListener('submit',async e=>{e.preventDefault();const password=document.querySelector('#password').value;if(password!==document.querySelector('#confirm').value){message.textContent='비밀번호가 일치하지 않습니다.';return}const{error}=await window.supabaseClient.auth.updateUser({password});message.style.color=error?'#a22':'#176234';message.textContent=error?'비밀번호를 변경하지 못했습니다. 재설정 메일의 링크로 다시 접속해 주세요.':'변경되었습니다. 관리자 페이지에서 로그인해 주세요.'})</script></body></html>
